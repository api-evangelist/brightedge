aid: brightedge
name: BrightEdge
description: >-
  BrightEdge is an enterprise SEO and content performance platform, founded in
  2007 and headquartered in Silicon Valley, used by thousands of brands and a
  majority of the Fortune 100. Its products include the DataCube keyword and
  content data repository, ContentIQ site auditing, Autopilot, Copilot, and the
  DataMind AI engine plus AI Catalyst for generative-search visibility. The
  BrightEdge Platform API (v5.0) is a REST API published at api.brightedge.com
  that exposes accounts, keywords, keyword groups, competitors, domains, pages,
  backlinks, the DataCube dataset, recommendations, People-Also-Ask, SERP
  features, Core Web Vitals, bulk export, and user/organization management, so
  teams can integrate BrightEdge search and content intelligence into their own
  reporting, analytics, and data-warehouse workflows.

apis:
- aid: brightedge:brightedge-mcp-server
  name: BrightEdge MCP Server
  description: >-
    BrightEdge's hosted, remote Model Context Protocol server. An MCP client POSTs to https://mcp2.brightedge.com/mcp
    (or the SSE endpoint https://mcp2-sse.brightedge.com/sse) and, after an OAuth 2.0 authorization-code
    + PKCE flow fronted by Auth0, can query the customer's BrightEdge data live in natural language. The
    provider states the server is read-only and pulls data at query time. Published data domains are DataCube
    X, AI HyperCube, Keyword Reporting, Share of Voice, Analytics Reporting, Google Search Console, AI
    Catalyst, Recommendations and AI Agent Insights. Setup guides are published for ChatGPT, Claude, Gemini
    Enterprise, Lovable, Manus, Microsoft Copilot, n8n, OpenClaw, Relevance AI and Slack.
  humanURL: https://www.brightedge.com/brightedge-mcp
  baseURL: https://mcp2.brightedge.com/mcp

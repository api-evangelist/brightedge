method: searched
source: live GET probes of every BrightEdge host in apis.yml + the MCP hosts published
  at https://www.brightedge.com/brightedge-mcp
note: >-
  The BrightEdge MCP hosts (mcp2.brightedge.com, mcp.brightedge.com,
  mcp2-sse.brightedge.com) serve real RFC 8414 / RFC 9728 / OIDC discovery
  documents. The marketing host (www.brightedge.com) and the REST API host
  (api.brightedge.com) serve no /.well-known/ documents; the marketing host
  answers every /.well-known/* path with its 404 HTML page (117KB SPA/Drupal
  shell), which is a miss, not a document. www.brightedge.com/llms.txt IS a real
  200 text/plain document and is saved verbatim under llms/.

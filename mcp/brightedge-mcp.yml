generated: '2026-08-13'
method: searched
status: published
source: https://www.brightedge.com/brightedge-mcp
note: BrightEdge publishes a hosted, remote MCP server. It is OAuth 2.0 protected (Auth0 tenant mrkt-0365.us.auth0.com)
  and read-only by the provider's own description. An anonymous POST tools/list returns HTTP 401 invalid_token,
  so the live tool set and its inputSchemas require an authenticated introspection; the tool NAMES are
  not published on the setup page either. The data domains the server exposes ARE published and are recorded
  below. The candidate tool list previously derived from the REST OpenAPI is retained under candidate_tools_from_openapi
  as a derived artifact and MUST NOT be read as the server's real tool set.
deployment:
  mode: remote
  endpoint: https://mcp2.brightedge.com/mcp
  auth: oauth
  verified: probed
server:
  name: brightedge
  transport: http
  url: https://mcp2.brightedge.com/mcp
  docs: https://www.brightedge.com/brightedge-mcp
  contact: integrations@brightedge.com
  read_only: true
  read_only_source: 'https://www.brightedge.com/brightedge-mcp — "Read-only: BrightEdge MCP tools retrieve
    data only. Nothing in your BrightEdge account is modified."'
endpoints:
- transport: http-streamable
  url: https://mcp2.brightedge.com/mcp
  note: primary endpoint; used by ChatGPT, Claude, Gemini Enterprise, Microsoft Copilot, n8n, Relevance
    AI, mcporter/OpenClaw
  probe:
    method: POST tools/list
    status: 401
    www_authenticate: Bearer error="invalid_token", error_description="Authentication required", resource_metadata="https://mcp2.brightedge.com/.well-known/oauth-protected-resource/mcp"
- transport: sse
  url: https://mcp2-sse.brightedge.com/sse
  note: Server-Sent Events endpoint for platforms that require SSE transport (Manus, Lovable, OpenClaw)
- transport: http
  url: https://mcp.brightedge.com/marketplace/v2
  note: endpoint behind the pre-built BrightEdge plugin in the OpenAI plugin repository
  probe:
    method: POST tools/list
    status: 401
authentication:
  type: oauth2
  grant: authorization_code
  pkce: S256
  identity_provider: Auth0 (mrkt-0365.us.auth0.com)
  authorization_endpoint: https://mcp2.brightedge.com/authorize
  token_endpoint: https://mcp2.brightedge.com/token
  scopes_documented:
  - openid
  - profile
  - email
  scopes_advertised_by_protected_resource:
  - openid
  discovery:
  - https://mcp2.brightedge.com/.well-known/oauth-authorization-server
  - https://mcp2.brightedge.com/.well-known/oauth-protected-resource
  - https://mcp2.brightedge.com/.well-known/openid-configuration
  client_registration: not self-serve — the OAuth Client ID/Secret are issued by a BrightEdge Customer
    Success Manager or integrations@brightedge.com; redirect URLs must be allowlisted by BrightEdge
  ref: authentication/brightedge-authentication.yml
access:
  eligibility: all BrightEdge customers with valid BrightEdge login credentials
  self_serve: false
  source: https://www.brightedge.com/brightedge-mcp

note: >-
  BrightEdge runs two machine surfaces: the REST Platform API v5.0 (248 operations, OpenAPI 3.1,
  api.brightedge.com) and a hosted MCP server (mcp2.brightedge.com/mcp). They are NOT the same
  projection of the data core, and the divergence is recorded here rather than papered over.
  crosswalk[] is deliberately EMPTY: an anonymous POST tools/list against the MCP endpoint returns
  HTTP 401 invalid_token, and the setup page publishes the DATA DOMAINS the server exposes but not
  the tool names or their inputSchemas. Binding a tool to an operationId therefore cannot be done
  without authenticated introspection, and naming tools we have not observed would fabricate the
  provider's agent surface. What CAN be bound honestly is the published domain -> REST-capability
  mapping, recorded under domain_crosswalk[] at low/medium confidence.

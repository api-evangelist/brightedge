note: >-
  Two surfaces with different conformance profiles. The REST Platform API v5.0 is a FastAPI-shaped
  key/basic-auth API with no OAuth and no RFC 9457 problem details. The MCP server is a standards-
  conformant OAuth 2.1-style resource: it serves RFC 8414 authorization-server metadata, RFC 9728
  protected-resource metadata, OIDC discovery, and challenges anonymous calls with a correct
  WWW-Authenticate Bearer header naming its resource metadata URL.

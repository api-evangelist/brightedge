components:
  schemas:
    MarketoTopKeywordsPerPageResponseDataItem:
      properties:
        keyword:
          type: string
          title: Keyword
        volume:
          type: integer
          title: Volume
        blended_rank:
          type: integer
          title: Blended Rank
      type: object
      title: MarketoTopKeywordsPerPageResponseDataItem
    MarketoTopPagesResponseData:
      properties:
        pages:
          items:
            $ref: '#/components/schemas/MarketoTopPagesResponseDataItem'
          type: array
          title: Pages
      type: object
      title: MarketoTopPagesResponseData
    MarketoTopKeywordsPerDomainResponse:
      properties:
        status:
          type: boolean
          title: Status
        message:
          type: string
          title: Message
        info:
          $ref: '#/components/schemas/MarketoResponseInfo'
        data:
          $ref: '#/components/schemas/MarketoTopKeywordsPerDomainResponseData'
      type: object
      required:
      - status
      - message
      - info
      - data
      title: MarketoTopKeywordsPerDomainResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    MarketoTopKeywordsPerDomainResponseData:
      properties:
        keywords:
          items:
            $ref: '#/components/schemas/MarketoTopKeywordsPerDomainResponseDataItem'
          type: array
          title: Keywords
      type: object
      title: MarketoTopKeywordsPerDomainResponseData
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MarketoTopKeywordsPerPageResponseData:
      properties:
        keywords:
          items:
            $ref: '#/components/schemas/MarketoTopKeywordsPerPageResponseDataItem'
          type: array
          title: Keywords
      type: object
      title: MarketoTopKeywordsPerPageResponseData
    MarketoTopPagesResponseDataItem:
      properties:
        url:
          type: string
          title: Url
        search_vol:
          type: integer
          title: Search Vol
        average_rank:
          type: integer
          title: Average Rank
        est_visits:
          type: integer
          title: Est Visits
      type: object
      title: MarketoTopPagesResponseDataItem
    MarketoResponseInfo:
      properties:
        version:
          type: string
          title: Version
        timestamp:
          type: number
          title: Timestamp
      type: object
      required:
      - version
      - timestamp
      title: MarketoResponseInfo
    MarketoTopKeywordsPerPageResponse:
      properties:
        status:
          type: boolean
          title: Status
        message:
          type: string
          title: Message
        info:
          $ref: '#/components/schemas/MarketoResponseInfo'
        data:
          $ref: '#/components/schemas/MarketoTopKeywordsPerPageResponseData'
      type: object
      required:
      - status
      - message
      - info
      - data
      title: MarketoTopKeywordsPerPageResponse
    MarketoTopPagesRequest:
      properties:
        collector_id:
          type: integer
          title: Collector Id
          default: 34
        domain:
          type: string
          minLength: 1
          title: Domain
        limit:
          type: integer
          maximum: 1000.0
          exclusiveMinimum: 0.0
          title: Limit
          default: 1000
      type: object
      required:
      - domain
      title: MarketoTopPagesRequest
    MarketoPaaResponse:
      properties:
        status:
          type: boolean
          title: Status
        message:
          type: string
          title: Message
        info:
          $ref: '#/components/schemas/MarketoResponseInfo'
        data:
          $ref: '#/components/schemas/MarketoPaaResponseData'
      type: object
      required:
      - status
      - message
      - info
      - data
      title: MarketoPaaResponse
    MarketoPaaRequest:
      properties:
        collector_id:
          type: integer
          title: Collector Id
          default: 34
        keyword:
          type: string
          minLength: 1
          title: Keyword
        limit:
          type: integer
          maximum: 4.0
          exclusiveMinimum: 0.0
          title: Limit
          default: 4
      type: object
      required:
      - keyword
      title: MarketoPaaRequest
    MarketoTopKeywordsPerDomainRequest:
      properties:
        collector_id:
          type: integer
          title: Collector Id
          default: 34
        domain:
          type: string

          default: 5
      type: object
      required:
      - page
      title: MarketoTopKeywordsPerPageRequest
    MarketoCacheRequest:
      properties:
        url:
          type: string
          minLength: 1
          title: Url
      type: object
      required:
      - url
      title: MarketoCacheRequest
    MarketoTopKeywordsPerDomainResponseDataItem:
      properties:
        keyword:
          type: string
          title: Keyword
        volume:
          type: integer
          title: Volume
        blended_rank:
          type: integer
          title: Blended Rank
        est_visits:
          type: integer
          title: Est Visits
        top_url:
          type: string
          title: Top Url
      type: object
      title: MarketoTopKeywordsPerDomainResponseDataItem
    MarketoTopPagesResponse:
      properties:

          title: Landing Url
      type: object
      title: MarketoPaaResponseDataItem
    MarketoPaaResponseData:
      properties:
        keyword:
          type: string
          title: Keyword
        questions:
          items:
            $ref: '#/components/schemas/MarketoPaaResponseDataItem'
          type: array
          title: Questions
      type: object
      title: MarketoPaaResponseData
    MarketoTopKeywordsPerPageRequest:
      properties:
        collector_id:
          type: integer
          title: Collector Id
          default: 34
        page:
          type: string
          minLength: 1
          title: Page
        limit:

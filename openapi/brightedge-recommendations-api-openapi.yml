openapi: 3.1.0
info:
  title: BrightEdge Platform accounts recommendations API
  description: This API provides the ability to integrate with BrightEdge Platform
  version: 5.0.0
tags:
- name: recommendations
paths:
  /5.0/organizations/objects/pbr_page_keyword_pop_up/{account_id}:
    post:
      tags:
      - recommendations
      summary: This call returns details of keyword recommendation
      operationId: get_keyword_recommendation_details_5_0_organizations_objects_pbr_page_keyword_pop_up__account_id__post
      parameters:
      - required: true
        schema:
          type: integer
          title: Account Id
        name: account_id
        in: path
      - required: false
        schema:
          type: integer
          title: Limit
        name: limit
        in: query
      - required: false
        schema:
          type: integer
          title: Offset
        name: offset
        in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationKwListRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationKwListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []
  /5.0/organizations/objects/pbr_keywords/{account_id}:
    post:
      tags:
      - recommendations
      summary: This endpoint allows change priority of keywords
      operationId: change_keyword_priority_5_0_organizations_objects_pbr_keywords__account_id__post
      parameters:
      - required: true
        schema:
          type: integer
          title: Account Id
        name: account_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationKwChangePriorityRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []
  /5.0/organizations/objects/get_tracked_pages/{account_id}:
    get:
      tags:
      - recommendations
      summary: This call returns list of tracked pages
      operationId: get_tracked_pages_5_0_organizations_objects_get_tracked_pages__account_id__get
      parameters:
      - required: true
        schema:
          type: integer
          title: Account Id
        name: account_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []
  /latest5/organizations/objects/pbr_page_keyword_pop_up/{account_id}:
    post:
      tags:
      - recommendations
      summary: This call returns details of keyword recommendation
      operationId: get_keyword_recommendation_details_latest5_organizations_objects_pbr_page_keyword_pop_up__account_id__post
      parameters:
      - required: true
        schema:
          type: integer
          title: Account Id
        name: account_id
        in: path
      - required: false
        schema:
          type: integer
          title: Limit
        name: limit
        in: query
      - required: false
        schema:
          type: integer
          title: Offset
        name: offset
        in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationKwListRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationKwListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []
  /latest5/organizations/objects/pbr_keywords/{account_id}:
    post:
      tags:
      - recommendations
      summary: This endpoint allows change priority of keywords
      operationId: change_keyword_priority_latest5_organizations_objects_pbr_keywords__account_id__post
      parameters:
      - required: true
        schema:
          type: integer
          title: Account Id
        name: account_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationKwChangePriorityRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []
  /latest5/organizations/objects/get_tracked_pages/{account_id}:
    get:
      tags:
      - recommendations
      summary: This call returns list of tracked pages
      operationId: get_tracked_pages_latest5_organizations_objects_get_tracked_pages__account_id__get
      parameters:
      - required: true
        schema:
          type: integer
          title: Account Id
        name: account_id

openapi: 3.1.0
info:
  title: BrightEdge Platform accounts users API
  description: This API provides the ability to integrate with BrightEdge Platform
  version: 5.0.0
tags:
- name: users
  description: Operation related to users
paths:
  /5.0/objects/users/create:
    post:
      tags:
      - users
      summary: Create a new user
      description: 'Create a new user.

        Mandatory fields: org_id, account_id, login'
      operationId: create_user_route_5_0_objects_users_create_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []
  /5.0/objects/users/update:
    post:
      tags:
      - users
      summary: Update user details
      description: 'Update existing user.

        Mandatory field: login'
      operationId: update_user_5_0_objects_users_update_post

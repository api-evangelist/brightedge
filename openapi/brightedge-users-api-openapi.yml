      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []
  /5.0/objects/users/{login}:
    delete:
      tags:
      - users
      summary: Delete a user
      description: 'Delete existing user.

        Mandatory field: login'
      operationId: delete_user_5_0_objects_users__login__delete
      parameters:
      - required: true
        schema:
          type: string
          format: email
          title: Login
        name: login
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:

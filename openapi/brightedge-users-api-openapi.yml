      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []
  /5.0/objects/users/grant_account_access:
    post:
      tags:
      - users
      summary: Grant account access to user
      description: 'Grant access to multiple accounts for a user.

        Creates or updates user_accounts rows for each account_id provided.'
      operationId: grant_user_account_access_5_0_objects_users_grant_account_access_post

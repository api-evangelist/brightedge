components:
  schemas:
    BulkCreateUserRequest:
      properties:
        users:
          items:
            $ref: '#/components/schemas/CreateUserRequest'
          type: array
          title: Users
      type: object
      required:
      - users
      title: BulkCreateUserRequest
    UserAccountAccessRequest:
      properties:
        login:
          type: string
          format: email
          title: Login
          description: User login/email
        account_ids:
          items:
            type: integer
          type: array
          title: Account Ids
          description: List of account IDs to change access
      type: object
      required:
      - login
      - account_ids
      title: UserAccountAccessRequest
    CreateUserRequest:
      properties:
        org_id:
          type: integer
          title: Org Id
          description: Organization ID
        account_id:
          type: integer
          title: Account Id
          description: Account ID
        login:
          type: string
          format: email
          title: Login
          description: User login/email
        user_type:
          type: integer
          title: User Type
          description: User type
          default: 1
        role:
          type: integer
          title: Role
          description: User role
          default: 1
        additional_user_account_id_list:
          items:
            type: integer
          type: array
          title: Additional User Account Id List
          description: Additional account IDs for the user
        first_name:
          type: string
          title: First Name
          description: User's first name
        last_name:
          type: string
          title: Last Name
          description: User's last name
      type: object
      required:
      - org_id
      - account_id
      - login
      title: CreateUserRequest
    UserAccountAccessResponse:
      properties:
        success:
          type: boolean
          title: Success
        message:
          type: string
          title: Message
        access_modified_account_ids:
          items:
            type: integer
          type: array
          title: Access Modified Account Ids
          description: List of account IDs access changed
      type: object
      required:
      - success
      - message
      title: UserAccountAccessResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    UserDeleteResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: UserDeleteResponse
    BulkDeleteUserRequest:
      properties:
        logins:
          items:
            type: string
            format: email
          type: array
          title: Logins
      type: object
      required:
      - logins
      title: BulkDeleteUserRequest
    UserCreateResponse:
      properties:
        success:
          type: boolean
          title: Success
        message:
          type: string
          title: Message
      type: object
      required:
      - success
      - message
      title: UserCreateResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    BulkUpdateUserRequest:
      properties:
        users:
          items:
            $ref: '#/components/schemas/UpdateUserRequest'
          type: array
          title: Users
      type: object
      required:
      - users
      title: BulkUpdateUserRequest
    UpdateUserRequest:
      properties:
        login:
          type: string
          format: email
          title: Login
          description: User login/email
        firstname:
          type: string
          title: Firstname
          description: User's first name
        lastname:
          type: string
          title: Lastname
          description: User's last name
        email:
          type: string
          format: email
          title: Email
          description: User's email
        title:
          type: string
          title: Title
          description: User's title
        phone:
          type: string
          title: Phone
          description: User's phone number
        locale:
          type: string
          title: Locale
          description: User's locale
        profile:
          type: integer
          title: Profile
          description: Users's profile
        address:
          type: string
          title: Address
      type: object
      required:
      - login
      title: UpdateUserRequest
    UserUpdateResponse:
      properties:
        status:
          type: boolean
          title: Status
        message:
          type: string
          title: Message
      type: object
      required:
      - status
      - message
      title: UserUpdateResponse
  securitySchemes:
    http_basic:
      type: http
      scheme: basic
    forwarded_http_basic:
      type: apiKey
      in: header
      name: X-Forwarded-Authorization
    session_cookie:
      type: apiKey
      in: cookie
      name: BRIGHTEDGE
    session_header:
      type: apiKey
      in: header
      name: X-BRIGHTEDGE-SESSION
    api_token_header:
      type: apiKey
      in: header
      name: X-Token
    bearer_token:
      type: apiKey
      in: header
      name: Bearer-Token

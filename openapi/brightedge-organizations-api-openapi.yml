components:
  schemas:
    OrganizationOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        created_on:
          type: string
          format: date-time
          title: Created On
        max_accounts:
          type: integer
          title: Max Accounts
        max_competitors:
          type: integer
          title: Max Competitors
      type: object
      required:
      - id
      - name
      - created_on
      - max_accounts
      - max_competitors
      title: OrganizationOut
    SiteAuditRulesOut:
      properties:
        description:
          type: string
          title: Description
        custom:
          type: boolean
          title: Custom
        value:
          type: integer
          title: Value
      type: object
      required:
      - description
      - custom
      - value
      title: SiteAuditRulesOut
    SiteAuditDimensionsIn:
      properties:
        time:
          type: string
          title: Time
      type: object
      required:
      - time
      title: SiteAuditDimensionsIn
    OrgAccountDetailOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        created_on_date:
          type: string
          format: date-time
          title: Created On Date
      type: object
      required:
      - id
      - name
      - created_on_date
      title: OrgAccountDetailOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    OrganizationUsersOutput:
      properties:
        total_pages:
          type: integer
          title: Total Pages
        users:
          items:
            $ref: '#/components/schemas/UserOutput'
          type: array
          title: Users
      type: object
      required:
      - total_pages
      - users
      title: OrganizationUsersOutput
    SiteAuditReportIn:
      properties:
        filters:
          items:
            items: {}
            type: array
          type: array
          title: Filters
        offset:
          items:
            type: integer
          type: array
          title: Offset
      type: object
      required:
      - filters
      title: SiteAuditReportIn
    SiteAuditPageGroupIn:
      properties:
        filters:
          items:
            items: {}
            type: array
          type: array
          title: Filters
        dimensionOptions:
          $ref: '#/components/schemas/SiteAuditDimensionsIn'
        order:
          items:
            items: {}
            type: array
          type: array
          title: Order
        offset:
          items:
            type: integer
          type: array
          title: Offset
      type: object
      required:
      - filters
      - dimensionOptions
      title: SiteAuditPageGroupIn
    SiteAuditResultsOut:
      properties:
        account_id:
          type: integer
          title: Account Id
        time:
          type: integer
          title: Time
        time_frequency:
          type: string
          title: Time Frequency
        crawl_id:
          type: integer
          title: Crawl Id
        page_type:
          type: integer
          title: Page Type
        preset:
          type: string
          title: Preset
        crawl_completed_date:
          type: string
          title: Crawl Completed Date
        total_pages_crawled:
          type: integer
          title: Total Pages Crawled
        crawl_status:
          type: integer
          title: Crawl Status
        error_code:
          type: integer
          title: Error Code
        rules:
          items:
            $ref: '#/components/schemas/SiteAuditRulesOut'
          type: array
          title: Rules
      type: object
      required:
      - account_id
      - time
      - time_frequency
      - crawl_id
      - page_type
      - preset
      - crawl_completed_date
      - total_pages_crawled
      - crawl_status
      - error_code
      - rules
      title: SiteAuditResultsOut
    UserOutput:

          title: Error Code
        crawl_status:
          type: integer
          title: Crawl Status
        page_details:
          items:
            type: object
          type: array
          title: Page Details
      type: object
      required:
      - account_id
      - yearweek
      - crawl_id
      - page_type
      - preset
      - crawl_completed_date
      - total_pages_crawled
      - error_code
      - crawl_status
      - page_details

      - count
      - results
      title: SiteAuditPageGroupOut
    SiteAuditCrawlReportOut:
      properties:
        account_id:
          type: integer
          title: Account Id
        yearweek:
          type: integer
          title: Yearweek
        crawl_id:
          type: integer
          title: Crawl Id
        page_type:
          type: string
          title: Page Type
        preset:
          type: string
          title: Preset
        crawl_completed_date:

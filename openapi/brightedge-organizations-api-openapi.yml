      - weekly
      - monthly
      - quarterly
      - yearly
      title: GeogorianTimeTimeStringType
      description: An enumeration.
    RecommendationOut:
      properties:
        account_id:
          type: integer
          title: Account Id
        total_pages:
          type: integer
          title: Total Pages
        rules:
          items: {}
          type: array
          title: Rules
      type: object
      required:
      - account_id
      - total_pages
      - rules
      title: RecommendationOut
    SiteAuditPageGroupOut:
      properties:

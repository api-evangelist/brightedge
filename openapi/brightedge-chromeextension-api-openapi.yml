components:
  schemas:
    AddRemoveKeywordsToGroupRequest:
      properties:
        keywords:
          items:
            type: string
          type: array
          title: Keywords
        group_id:
          type: integer
          title: Group Id
        action:
          type: string
          title: Action
      type: object
      required:
      - keywords
      - group_id
      - action
      title: AddRemoveKeywordsToGroupRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    KeywordGroupOutResp:
      properties:
        total:
          type: integer
          title: Total
        groups:
          items:
            $ref: '#/components/schemas/KeywordGroupOut'
          type: array
          title: Groups
      type: object
      required:
      - total
      - groups
      title: KeywordGroupOutResp
    KeywordRequestWithGroup:
      properties:
        keyword:
          type: string
          title: Keyword
      type: object
      required:
      - keyword
      title: KeywordRequestWithGroup
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KeywordOutWithGroup:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        keyword_group_id:
          type: integer
          title: Keyword Group Id
      type: object
      required:
      - id
      - name
      - keyword_group_id
      title: KeywordOutWithGroup
    KeywordOutWithGroupResp:
      properties:
        total:
          type: integer
          title: Total
        keywords:
          items:
            $ref: '#/components/schemas/KeywordOutWithGroup'
          type: array
          title: Keywords
      type: object
      required:
      - keywords
      title: KeywordOutWithGroupResp
    KeywordGroupOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: KeywordGroupOut
  securitySchemes:
    http_basic:
      type: http
      scheme: basic
    forwarded_http_basic:
      type: apiKey
      in: header
      name: X-Forwarded-Authorization
    session_cookie:
      type: apiKey
      in: cookie
      name: BRIGHTEDGE
    session_header:
      type: apiKey
      in: header
      name: X-BRIGHTEDGE-SESSION
    api_token_header:
      type: apiKey
      in: header
      name: X-Token
    bearer_token:
      type: apiKey
      in: header
      name: Bearer-Token

openapi: 3.2.0
info:
  title: BrightEdge Platform Domains API
  description: This API provides the ability to integrate with BrightEdge Platform
  version: 5.0.0
tags:
- name: Domains
  description: Operation related to domains
paths:
  /5.0/objects/competitors/{account_id}:
    get:
      tags:
      - Domains
      summary: This call returns a competitors for given account id
      operationId: get_account_competitors_5_0_objects_competitors__account_id__get
      parameters:
      - required: true
        schema:
          type: integer
          title: Account Id
        name: account_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CompetitorOut'
                type: array
                title: Response Get Account Competitors 5 0 Objects Competitors  Account Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []

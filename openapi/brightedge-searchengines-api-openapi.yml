components:
  schemas:
    SearchEngineOut:
      properties:
        id:
          type: integer
          title: Id
        country:
          type: string
          title: Country
        location:
          type: string
          title: Location
        device_type:
          type: string
          title: Device Type
        name:
          type: string
          title: Name
        se_group_id:
          type: string
          title: Se Group Id
      type: object
      required:
      - id
      - country
      - location
      - device_type
      - name
      - se_group_id
      title: SearchEngineOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    LegacySearchenginesOut:
      properties:
        searchengines:
          items:
            $ref: '#/components/schemas/LegacySearchenginesShortOut'
          type: array
          title: Searchengines
      type: object
      required:
      - searchengines
      title: LegacySearchenginesOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LegacySearchenginesShortOut:
      properties:
        display_name:
          type: string
          title: Display Name
        country:
          type: string
          title: Country
        searchengine:
          type: string
          title: Searchengine
        location:
          type: string
          title: Location
        device_type:
          type: string
          title: Device Type
        device_type_id:
          type: string
          title: Device Type Id
        searchengine_group_id:
          type: string
          title: Searchengine Group Id
        id:
          type: string
          title: Id
      type: object
      required:
      - display_name
      - country
      - searchengine
      - location
      - device_type
      - device_type_id
      - searchengine_group_id
      - id
      title: LegacySearchenginesShortOut
  securitySchemes:
    http_basic:
      type: http
      scheme: basic
    forwarded_http_basic:
      type: apiKey
      in: header
      name: X-Forwarded-Authorization
    session_cookie:
      type: apiKey
      in: cookie
      name: BRIGHTEDGE
    session_header:
      type: apiKey
      in: header
      name: X-BRIGHTEDGE-SESSION
    api_token_header:
      type: apiKey
      in: header
      name: X-Token
    bearer_token:
      type: apiKey
      in: header
      name: Bearer-Token

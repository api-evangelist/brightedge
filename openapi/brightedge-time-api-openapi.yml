components:
  schemas:
    TimeFrequencyOut:
      properties:
        time_value:
          type: integer
          title: Time Value
        day_value:
          type: integer
          title: Day Value
        time_frequency:
          $ref: '#/components/schemas/TimeTimeStringType'
      type: object
      required:
      - time_value
      - day_value
      - time_frequency
      title: TimeFrequencyOut
    TimeTimeStringType:
      type: string
      enum:
      - daily
      - weekly
      - monthly
      - quarterly
      - yearly
      - fiscal_weekly
      - fiscal_monthly
      - fiscal_quarterly
      - fiscal_yearly
      title: TimeTimeStringType
      description: An enumeration.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    LegacyTimeFrequencyOut:
      properties:
        time_value:
          type: string
          title: Time Value
        day_value:
          type: string
          title: Day Value
        time_frequency:
          $ref: '#/components/schemas/TimeTimeStringType'
      type: object
      required:
      - time_value
      - day_value
      - time_frequency
      title: LegacyTimeFrequencyOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    http_basic:
      type: http
      scheme: basic
    forwarded_http_basic:
      type: apiKey
      in: header
      name: X-Forwarded-Authorization
    session_cookie:
      type: apiKey
      in: cookie
      name: BRIGHTEDGE
    session_header:
      type: apiKey
      in: header
      name: X-BRIGHTEDGE-SESSION
    api_token_header:
      type: apiKey
      in: header
      name: X-Token
    bearer_token:
      type: apiKey
      in: header
      name: Bearer-Token

      - chrome_extension
      summary: Get Image tags Alt texts
      operationId: images_5_0_chrome_extension_overview_images_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Images 5 0 Chrome Extension Overview Images Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []

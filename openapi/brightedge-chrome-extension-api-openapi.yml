components:
  schemas:
    KeywordGroups:
      properties:
        keyword_groups:
          items:
            $ref: '#/components/schemas/KeywordGroupDetail'
          type: array
          title: Keyword Groups
      type: object
      required:
      - keyword_groups
      title: KeywordGroups
    ContentInput:
      properties:
        account_id:
          type: integer
          title: Account Id
        se_group_id:
          type: integer
          title: Se Group Id
        url:
          type: string
          title: Url
      type: object
      required:
      - account_id
      - se_group_id
      - url
      title: ContentInput
    Content:
      properties:
        word_count:
          type: integer
          title: Word Count
        headings:
          $ref: '#/components/schemas/Headings'
      type: object
      required:
      - word_count
      - headings
      title: Content
    Pagination:
      properties:
        offset:
          type: integer
          title: Offset
          default: 0
        limit:
          type: integer
          title: Limit
          default: 25
      type: object
      title: Pagination
    ResearchKeywordsInput:
      properties:
        keyword:
          type: string
          title: Keyword
        se_group_id:
          type: string
          title: Se Group Id
        account_id:
          type: integer
          title: Account Id
      type: object
      required:
      - keyword
      - se_group_id
      - account_id
      title: ResearchKeywordsInput
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Headings:
      properties:
        H1:
          items:
            type: string
          type: array
          title: H1
          default: []
        H2:
          items:
            type: string
          type: array
          title: H2
          default: []
      type: object
      title: Headings
    TrackKeywordsInput:
      properties:
        account_id:
          type: integer
          title: Account Id
        pagination:
          $ref: '#/components/schemas/Pagination'
      type: object
      required:
      - account_id
      title: TrackKeywordsInput
    KeywordGroupDetail:
      properties:
        group_id:
          type: integer
          title: Group Id
        keyword_group_name:
          type: string
          title: Keyword Group Name
      type: object
      required:
      - group_id
      - keyword_group_name
      title: KeywordGroupDetail
    WebVitals:
      properties:
        lcp:
          type: string
          title: Lcp
          default: ''
        fid:
          type: string
          title: Fid
          default: ''
        cls:
          type: string
          title: Cls
          default: ''
        inp:
          type: string
          title: Inp
          default: ''
      type: object
      title: WebVitals
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DomainComparisonInput:
      properties:
        account_id:
          type: integer
          title: Account Id
        base_domain:
          type: string
          title: Base Domain
        compare_domain:
          type: string
          title: Compare Domain
        se_group_id:
          type: string
          title: Se Group Id
      type: object
      required:
      - account_id
      - base_domain
      - compare_domain
      - se_group_id
      title: DomainComparisonInput
    ImagesInput:
      properties:
        account_id:
          type: integer
          title: Account Id
        se_group_id:
          type: integer
          title: Se Group Id
        url:
          type: string
          title: Url
      type: object
      required:
      - account_id
      - se_group_id
      - url
      title: ImagesInput
  securitySchemes:
    http_basic:
      type: http
      scheme: basic
    forwarded_http_basic:
      type: apiKey
      in: header
      name: X-Forwarded-Authorization
    session_cookie:
      type: apiKey
      in: cookie
      name: BRIGHTEDGE
    session_header:
      type: apiKey
      in: header
      name: X-BRIGHTEDGE-SESSION
    api_token_header:
      type: apiKey
      in: header
      name: X-Token
    bearer_token:
      type: apiKey
      in: header
      name: Bearer-Token

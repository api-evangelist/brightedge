          title: Keyword
        se_group_id:
          type: string
          title: Se Group Id
        account_id:
          type: integer
          title: Account Id
      type: object
      required:
      - keyword
      - se_group_id
      - account_id
      title: ResearchKeywordsInput
    TrackKeywordsInput:
      properties:
        account_id:
          type: integer
          title: Account Id
        pagination:
          $ref: '#/components/schemas/Pagination'
      type: object
      required:
      - account_id
      title: TrackKeywordsInput
    KeywordGroupDetail:
      properties:
        group_id:
          type: integer
          title: Group Id
        keyword_group_name:
          type: string
          title: Keyword Group Name
      type: object
      required:
      - group_id
      - keyword_group_name
      title: KeywordGroupDetail
    WebVitals:
      properties:
        lcp:
          type: string
          title: Lcp
          default: ''
        fid:
          type: string
          title: Fid
          default: ''
        cls:
          type: string
          title: Cls
          default: ''
        inp:
          type: string
          title: Inp
          default: ''
      type: object
      title: WebVitals
    Pagination:
      properties:
        offset:
          type: integer
          title: Offset
          default: 0
        limit:
          type: integer
          title: Limit
          default: 25
      type: object
      title: Pagination
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DomainComparisonInput:
      properties:
        account_id:
          type: integer
          title: Account Id
        base_domain:
          type: string
          title: Base Domain
        compare_domain:
          type: string
          title: Compare Domain
        se_group_id:
          type: string
          title: Se Group Id
      type: object
      required:
      - account_id
      - base_domain
      - compare_domain
      - se_group_id
      title: DomainComparisonInput
    Headings:
      properties:
        H1:
          items:
            type: string
          type: array
          title: H1
          default: []
        H2:
          items:
            type: string
          type: array
          title: H2
          default: []
      type: object
      title: Headings
    HTTPValidationError:

      type: object
      required:
      - keywordgroups
      title: LegacyKeywordGroupOut
    KeywordOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: KeywordOut
    LegacyKeywordGroupDetailOut:

openapi: 3.1.0
info:
  title: BrightEdge Platform accounts keywordgroups API
  description: This API provides the ability to integrate with BrightEdge Platform
  version: 5.0.0
tags:
- name: keywordgroups
  description: Operation related to keyword groups
paths:
  /5.0/objects/keywordgroups/activity/{group_name}:
    get:
      tags:
      - keywordgroups
      summary: This call returns list of keyword activities per account
      operationId: get_keywords_activity_5_0_objects_keywordgroups_activity__group_name__get
      parameters:
      - required: true
        schema:
          type: string
          title: Group Name
        name: group_name
        in: path
      - required: false
        schema:
          type: integer
          maximum: 202605.0
          minimum: 202210.0
          title: Start Year Month
          default: 202605
        name: start_year_month
        in: query
      - required: false
        schema:
          type: integer
          maximum: 202606.0
          minimum: 202211.0
          title: End Year Month
          default: 202606
        name: end_year_month
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KeywordActivityOut'
                type: array
                title: Response Get Keywords Activity 5 0 Objects Keywordgroups Activity  Group Name  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []

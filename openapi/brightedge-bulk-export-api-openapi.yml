components:
  schemas:
    BulkExportJobResponse:
      properties:
        id:
          type: string
          title: Id
        job_id:
          type: string
          title: Job Id
        pod:
          type: integer
          title: Pod
        account_id:
          type: integer
          title: Account Id
        time_value:
          type: string
          title: Time Value
        time_cadence:
          type: string
          title: Time Cadence
        query_type:
          type: string
          title: Query Type
        user_id:
          type: integer
          title: User Id
        status:
          type: integer
          title: Status
        job_create_at:
          type: string
          format: date-time
          title: Job Create At
        job_start_at:
          type: string
          format: date-time
          title: Job Start At
        job_finish_at:
          type: string
          format: date-time
          title: Job Finish At
        job_exception:
          type: string
          title: Job Exception
        path:
          type: string
          title: Path
        retry_count:
          type: integer
          title: Retry Count
          default: 0
        destination:
          type: string
          title: Destination
          default: gcs
        device_id:
          type: string
          title: Device Id
          default: '*'
        group_id:
          type: string
          title: Group Id
          default: '*'
      type: object
      required:
      - id
      - job_id
      - pod
      - account_id
      - time_value
      - time_cadence
      - query_type
      - user_id
      - status
      - job_create_at
      title: BulkExportJobResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    BulkExportJobCreateResponse:
      properties:
        jobs:
          items:
            $ref: '#/components/schemas/BulkExportJobResponse'
          type: array
          title: Jobs
        total_jobs_created:
          type: integer
          title: Total Jobs Created
        message:
          type: string
          title: Message
      type: object
      required:
      - jobs
      - total_jobs_created
      - message
      title: BulkExportJobCreateResponse
      description: Response model for bulk job creation (handles multiple jobs)
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    BulkExportJobCreateRequest:
      properties:
        pod:
          type: integer
          title: Pod
        account_id:
          anyOf:
          - type: integer
          - items:
              type: integer
            type: array
          title: Account Id
        time_value:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          title: Time Value
        time_cadence:
          type: string
          title: Time Cadence
        query_type:
          type: string
          title: Query Type
        user_id:
          type: integer
          title: User Id
        path:
          type: string
          title: Path
        destination:
          type: string
          title: Destination
          default: gcs
        job_id:
          type: string
          title: Job Id
        device_id:
          type: string
          title: Device Id
          default: '*'
        group_id:
          type: string
          title: Group Id
          default: '*'
      type: object
      required:
      - pod
      - account_id
      - time_value
      - time_cadence
      - query_type
      - user_id
      - path
      title: BulkExportJobCreateRequest
  securitySchemes:
    http_basic:
      type: http
      scheme: basic
    forwarded_http_basic:
      type: apiKey
      in: header
      name: X-Forwarded-Authorization
    session_cookie:
      type: apiKey
      in: cookie
      name: BRIGHTEDGE
    session_header:
      type: apiKey
      in: header
      name: X-BRIGHTEDGE-SESSION
    api_token_header:
      type: apiKey
      in: header
      name: X-Token
    bearer_token:
      type: apiKey
      in: header
      name: Bearer-Token

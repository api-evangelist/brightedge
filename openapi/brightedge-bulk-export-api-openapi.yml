openapi: 3.1.0
info:
  title: BrightEdge Platform accounts bulk_export API
  description: This API provides the ability to integrate with BrightEdge Platform
  version: 5.0.0
tags:
- name: bulk_export
paths:
  /5.0/jobs:
    post:
      tags:
      - bulk_export
      summary: Create bulk export job(s)
      description: 'Create bulk export job(s) and store them in the database.


        - **pod**: Pod number for the job

        - **account_id**: Account ID or list of account IDs for the job(s)

        - **time_value**: Time value string or list of time values for the export

        - **time_cadence**: Time cadence (weekly, monthly, quarterly)

        - **query_type**: Type of query to run (keyword_join, keyword_only)

        - **user_id**: User ID creating the job

        - **path**: Google Cloud Storage path for the export

        - **destination**: Destination for export (default: "gcs")

        - **device_id**: Device ID filter (default: "*")

        - **group_id**: Group ID filter (default: "*")

        - **job_id**: Optional batch job ID (auto-generated if not provided)


        If multiple account IDs are provided, separate jobs will be created for each account.

        If multiple time values are provided, separate jobs will be created for each time value.

        The combination of account IDs and time values will create multiple jobs as needed.'
      operationId: create_bulk_export_job_5_0_jobs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkExportJobCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkExportJobCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []
  /5.0/jobs/{job_id}:
    get:
      tags:
      - bulk_export
      summary: Get all bulk export jobs by batch job ID
      description: 'Get all bulk export jobs that share the same batch job ID.


        - **job_id**: Batch job ID (UUID) that groups multiple individual jobs'
      operationId: get_bulk_export_jobs_by_batch_id_5_0_jobs__job_id__get
      parameters:
      - required: true
        schema:
          type: string
          title: Job Id
        name: job_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BulkExportJobResponse'
                type: array
                title: Response Get Bulk Export Jobs By Batch Id 5 0 Jobs  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []
  /5.0/jobs/account/{account_id}:
    get:
      tags:
      - bulk_export
      summary: Get all bulk export jobs for an account
      description: 'Get all bulk export jobs for a specific account.


        - **account_id**: Account ID to get jobs for'
      operationId: get_account_bulk_export_jobs_5_0_jobs_account__account_id__get
      parameters:
      - required: true
        schema:
          type: integer
          title: Account Id
        name: account_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BulkExportJobResponse'
                type: array
                title: Response Get Account Bulk Export Jobs 5 0 Jobs Account  Account Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - http_basic: []
      - forwarded_http_basic: []
      - session_cookie: []
      - session_header: []
      - api_token_header: []
      - bearer_token: []

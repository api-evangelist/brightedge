openapi: 3.2.0
info:
  title: BrightEdge MCP Server Authorize API
  description: MCP server wrapped with FastAPI for BrightEdge APIs
  version: '2.35'
tags:
- name: Authorize
paths:
  /authorize:
    get:
      summary: Authorize Proxy
      operationId: authorize_proxy_authorize_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Authorize
  /{slug}/authorize:
    get:
      summary: Authorize Proxy Tenant
      operationId: authorize_proxy_tenant__slug__authorize_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Authorize
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
